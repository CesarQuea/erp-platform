name: P7 Temporary Implementation Check

on:
  push:
    branches:
      - feat/platform-p7-sync-foundation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create dedicated P-7 PostgreSQL databases
        run: |
          python - <<'PY'
          import psycopg
          databases = ("p7_tenant_a", "p7_tenant_b", "p7_migration_a", "p7_migration_b")
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/postgres", autocommit=True) as connection:
              for database in databases:
                  with connection.cursor() as cursor:
                      cursor.execute(f'DROP DATABASE IF EXISTS "{database}" WITH (FORCE)')
                      cursor.execute(f'CREATE DATABASE "{database}"')
          PY

      - name: Generate OpenAPI baseline
        run: python scripts/generate_openapi.py

      - name: Run P-7 focal suite
        env:
          P7_TEST_TENANT_DATABASES_JSON: >-
            {"11111111-1111-4111-8111-111111111111":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_tenant_a"},"22222222-2222-4222-8222-222222222222":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_tenant_b"}}
          P7_MIGRATION_TEST_TENANT_DATABASES_JSON: >-
            {"33333333-3333-4333-8333-333333333333":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_migration_a"},"44444444-4444-4444-8444-444444444444":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_migration_b"}}
        run: |
          mkdir -p verification/P7/ci
          python -m pytest -q \
            tests/test_p7_sync_primitives.py \
            tests/test_p7_sync_persistence.py \
            tests/test_p7_sync_query.py \
            tests/test_p7_sync_hardening.py \
            tests/test_p7_sync_api.py \
            tests/test_p7_sync_postgres.py \
            tests/test_p7_forward_migration_postgres.py \
            tests/test_o4_milking_migration_chain.py \
            tests/test_p5_module_migration_chain.py \
            tests/test_p6_api_contracts.py \
            --junitxml=verification/P7/ci/junit-p7-focal.xml

      - name: Run repository suite
        env:
          P7_TEST_TENANT_DATABASES_JSON: >-
            {"11111111-1111-4111-8111-111111111111":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_tenant_a"},"22222222-2222-4222-8222-222222222222":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_tenant_b"}}
          P7_MIGRATION_TEST_TENANT_DATABASES_JSON: >-
            {"33333333-3333-4333-8333-333333333333":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_migration_a"},"44444444-4444-4444-8444-444444444444":{"database_url":"postgresql+psycopg://postgres:postgres@localhost:5432/p7_migration_b"}}
        run: |
          python -m pytest -q --junitxml=verification/P7/ci/junit-repository.xml

      - name: Commit generated OpenAPI baseline
        run: |
          if git diff --quiet -- contracts/api/v1/openapi.json; then
            echo "OpenAPI baseline already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/api/v1/openapi.json
          git commit -m "docs(api): regenerate v1 OpenAPI for P-7"
          git push origin HEAD:feat/platform-p7-sync-foundation

      - name: Upload P-7 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-temporary-ci-evidence
          path: verification/P7/ci/*.xml
          if-no-files-found: warn
