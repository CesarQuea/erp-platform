name: P6 OpenAPI Snapshot

on:
  push:
    branches:
      - feat/platform-p6-api-contracts

permissions:
  contents: read

jobs:
  generate-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate OpenAPI baseline
        run: python scripts/generate_openapi.py
      - name: Verify committed OpenAPI baseline
        run: git diff --exit-code -- contracts/api/v1/openapi.json
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Run P-6 focal tests
        run: python -m pytest -q tests/test_p6_api_contracts.py tests/test_p6_module_api.py tests/test_o4_milking_api.py
      - name: Upload generated baseline
        uses: actions/upload-artifact@v4
        with:
          name: p6-openapi-baseline
          path: contracts/api/v1/openapi.json
          if-no-files-found: error
